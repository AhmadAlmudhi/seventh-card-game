name: seventh_card_game
description: "The Seventh Card (الورقة السابعة): a real-time card game for friends."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Static instances of the Cairo variable font (SIL OFL 1.1, see assets/fonts/OFL.txt).
  # Bundle only the weights the app uses (PRD §6.0).
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
