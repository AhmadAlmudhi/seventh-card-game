# Plays 10,000 random games every night to find rare rule bugs (PRD §11.2).
# A failure prints the seed: replay it locally with `SIM_SEED=<seed> npm run test:sim`.
name: Nightly simulation

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run test:sim:long
