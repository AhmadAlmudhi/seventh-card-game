# Builds the Flutter web app and publishes it to GitHub Pages (PRD §10.1).
# Needs: Settings → Pages → Source set to "GitHub Actions".
# Optional repository variable SERVER_URL (wss://...), used from M3 onward.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - lib/**
      - test/**
      - web/**
      - assets/**
      - pubspec.yaml
      - pubspec.lock
      - l10n.yaml
      - analysis_options.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The site is served from /<repo>/, so the base href comes from the repository name.
      - name: Build
        run: >-
          flutter build web --release
          --base-href "/${GITHUB_REPOSITORY#*/}/"
          --dart-define=SERVER_URL="${{ vars.SERVER_URL }}"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
